<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log In - Luxury VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --primary-bg: #0f172a;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
        }

        .full-screen-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        /* Decorative Background Glows */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--accent-purple);
            filter: blur(150px);
            opacity: 0.15;
            z-index: 0;
            border-radius: 50%;
        }
        .glow-1 { top: -50px; right: -50px; }
        .glow-2 { bottom: -50px; left: -50px; background: var(--accent-blue); }

        .content-area {
            width: 100%;
            max-width: 400px;
            z-index: 10;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo-img {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            background: white;
            padding: 12px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
            object-fit: contain;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 40px;
        }

        .form-container {
            width: 100%;
            animation: fadeInUp 0.8s ease-out;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-field {
            width: 100%;
            padding: 16px;
            background: var(--glass-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-purple);
            background: rgba(30, 41, 59, 0.9);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-btn:active {
            transform: scale(0.98);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }

        .footer-links {
            margin-top: 30px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--accent-purple);
            text-decoration: none;
            font-weight: 700;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="full-screen-wrapper">
        <div class="content-area">
            <div class="logo-container">
                <!-- IMPORTANT: Make sure assets/logo.png exists in your GitHub -->
                <img src="assets/logo.png" alt="Logo" class="logo-img">
            </div>

            <h1>Welcome Back</h1>
            <p class="subtitle">Securely log in to your Luxury VIP account</p>

            <form class="form-container" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Username or Phone</label>
                    <input type="text" id="loginIdentifier" class="input-field" placeholder="Enter your credentials" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" class="input-field" placeholder="••••••••" required>
                </div>

                <button type="submit" class="login-btn">Sign In to Dashboard</button>
            </form>

            <div class="footer-links">
                Don't have an account? <a href="register.html">Create One Now</a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginIdentifier').value.trim();
            const pass = document.getElementById('loginPassword').value;
            const allUsers = JSON.parse(localStorage.getItem('allUsers') || '{}');
            let foundUser = null;

            for (let name in allUsers) {
                const user = allUsers[name];
                if (name === identifier || user.phone === identifier) {
                    foundUser = user;
                    break;
                }
            }

            if (foundUser && foundUser.password === pass) {
                localStorage.setItem('username', foundUser.username);
                localStorage.setItem('userName', foundUser.username);
                localStorage.setItem('userGender', foundUser.gender);
                localStorage.setItem('myInviteCode', foundUser.myInviteCode);
                window.location.href = 'dashboard.html';
            } else {
                alert('Invalid credentials. Please check your username and password.');
            }
        }
    </script>
</body>
</html>
