<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Luxury VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --primary-color: #f8fafc;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --bg-color: #090d16;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.3);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .dashboard-container {
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .welcome-text {
            font-size: 18px;
            font-weight: 700;
            color: #38bdf8;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .logout-btn:hover {
            opacity: 0.9;
        }

        .balance-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .balance-title {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: 700;
            color: #fde047;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 16px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-color);
        }

        .action-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .action-card h3 {
            margin-top: 0;
            font-size: 18px;
            margin-bottom: 12px;
            color: #38bdf8;
        }

        .action-card p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .start-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            box-sizing: border-box;
        }

        .start-btn:hover {
            opacity: 0.9;
        }

        /* Bottom Navigation Bar Styles */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0b1120;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 65px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
            flex: 1;
            cursor: pointer;
        }

        .nav-item.active {
            color: #ffd700;
        }

        .nav-item span.icon {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .nav-item-center {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            text-decoration: none;
            cursor: pointer;
        }

        .floating-center-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #fde047, #ca8a04);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: -25px;
            box-shadow: 0 4px 15px rgba(253, 224, 71, 0.4);
            color: #0f172a;
            font-size: 22px;
            border: 2px solid #0b1120;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header-section">
            <div class="welcome-text" id="welcomeUser">Welcome, User</div>
            <button class="logout-btn" id="logoutBtn">Log Out</button>
        </div>

        <div class="balance-card">
            <div class="balance-title">Available Balance</div>
            <div class="balance-amount" id="userBalance">$0.00</div>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Completed</div>
                    <div class="stat-value" id="completedTasks">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Today's Profit</div>
                    <div class="stat-value" id="todaysProfit">$0.00</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Total Profit</div>
                    <div class="stat-value" id="totalProfit">$0.00</div>
                </div>
            </div>
        </div>

        <div class="action-card">
            <h3>VIP Task Center</h3>
            <p>Complete your daily optimization tasks to unlock maximum earnings and high-yield returns.</p>
            <a href="start.html" class="start-btn">Start Grabbing Tasks</a>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item active">
            <span class="icon">🏠</span><span>Home</span>
        </a>
        <a href="start.html" class="nav-item-center">
            <div class="floating-center-btn">⚡</div>
        </a>
        <a href="records.html" class="nav-item">
            <span class="icon">📋</span><span>Records</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="icon">👤</span><span>My</span>
        </a>
    </nav>

    <script>
        const currentUsername = localStorage.getItem('username');

        if (!currentUsername) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('welcomeUser').textContent = 'Welcome, ' + currentUsername;

            const balanceKey = `userBalance_${currentUsername}`;
            const completedKey = `completedTasks_${currentUsername}`;
            const todaysProfitKey = `todaysProfit_${currentUsername}`;
            const totalProfitKey = `totalProfit_${currentUsername}`;

            document.getElementById('userBalance').textContent = '$' + parseFloat(localStorage.getItem(balanceKey) || '10.00').toFixed(2);
            document.getElementById('completedTasks').textContent = localStorage.getItem(completedKey) || '0';
            document.getElementById('todaysProfit').textContent = '$' + parseFloat(localStorage.getItem(todaysProfitKey) || '0.00').toFixed(2);
            document.getElementById('totalProfit').textContent = '$' + parseFloat(localStorage.getItem(totalProfitKey) || '0.00').toFixed(2);
        }

        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('username');
            localStorage.removeItem('userName');
            localStorage.removeItem('userGender');
            localStorage.removeItem('userPhone');
            localStorage.removeItem('myInviteCode');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
