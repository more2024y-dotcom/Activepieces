<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Certificate - Official</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root {
            --primary-blue: #0f172a;
            --accent-blue: #2563eb;
            --accent-blue-light: #3b82f6;
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 100px;
        }
        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .top-nav-bar {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: var(--accent-blue-light);
            padding: 6px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        .header-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            text-align: center;
        }
        .cert-image-container {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #ffffff;
            margin-bottom: 18px;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }
        .cert-image-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }
        .cert-divider {
            height: 2px;
            background: var(--accent-blue-light);
            margin-bottom: 18px;
            border-radius: 2px;
        }
        .cert-title {
            font-size: 18px;
            font-weight: 700;
            color: #fde047;
            margin-bottom: 12px;
        }
        .cert-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0b1120;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 65px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
            flex: 1;
        }
        .nav-item.active {
            color: #ffd700;
        }
        .nav-item span.icon {
            font-size: 18px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-nav-bar">
            <a href="javascript:history.back()" class="back-btn">&lt; Back</a>
        </div>
        <div class="header-title">Official Certificate</div>
        
        <div class="card">
            <div class="cert-divider"></div>
            
            <div class="cert-image-container">
                <img src="assets/certificate.jpg" alt="Articles of Incorporation" onerror="this.src='https://via.placeholder.com/400x550?text=Please+Add+certificate.jpg+to+assets+folder'">
            </div>
            
            <div class="cert-title">Certificate of Incorporation</div>
            <p class="cert-desc">
                Verified, fully authorized, and operating in compliance with international standards.
            </p>
        </div>
    </div>

    <!-- Bottom Navigation Bar pointing to home.html -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <span class="icon">🏠</span><span>Home</span>
        </a>
        <a href="certificate.html" class="nav-item active" style="color: #ffd700;">
            <span class="icon">🏆</span><span>Certificate</span>
        </a>
        <a href="start.html" class="nav-item">
            <span class="icon">🚀</span><span>Starting</span>
        </a>
        <a href="records.html" class="nav-item">
            <span class="icon">📋</span><span>Records</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="icon">👤</span><span>My</span>
        </a>
    </nav>

</body>
</html>
