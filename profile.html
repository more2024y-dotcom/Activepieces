<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - VIP Platform</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root {
            --primary-blue: #0f172a;
            --accent-blue: #2563eb;
            --accent-blue-light: #3b82f6;
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 100px;
        }
        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .header-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }
        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            display: block;
            text-decoration: none;
            box-sizing: border-box;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0b1120;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 65px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
            flex: 1;
            cursor: pointer;
        }
        .nav-item.active {
            color: #ffd700;
        }
        .nav-item span.icon {
            font-size: 18px;
            margin-bottom: 2px;
        }
        .nav-item-center {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            text-decoration: none;
            cursor: pointer;
        }
        .floating-center-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #fde047, #ca8a04);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: -25px;
            box-shadow: 0 4px 15px rgba(253, 224, 71, 0.4);
            color: #0f172a;
            font-size: 22px;
            border: 2px solid #0b1120;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">My Profile</div>
        
        <div class="card">
            <!-- Logout / Switch Account -->
            <button class="logout-btn" onclick="localStorage.clear(); window.location.href='index.html';">
                Log Out / Switch Account
            </button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <span class="icon">🏠</span><span>Home</span>
        </a>
        <a href="start.html" class="nav-item-center">
            <div class="floating-center-btn">⚡</div>
        </a>
        <a href="records.html" class="nav-item">
            <span class="icon">📋</span><span>Records</span>
        </a>
        <a href="profile.html" class="nav-item active" style="color: #ffd700;">
            <span class="icon">👤</span><span>My</span>
        </a>
    </nav>

</body>
</html>
