<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Luxury VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --primary-blue: #0f172a;
            --accent-blue: #2563eb;
            --accent-blue-light: #3b82f6;
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.3);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 100px;
        }

        .container {
            padding: 16px;
            max-width: 440px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .header-title {
            font-size: 22px;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 20px;
            text-align: center;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
            background-color: #0f172a;
        }

        .profile-info h1 {
            margin: 0 0 4px 0;
            font-size: 20px;
            color: #38bdf8;
        }

        .vip {
            display: inline-block;
            background: rgba(253, 224, 71, 0.15);
            color: #fde047;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .profile-info p {
            margin: 2px 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        .profile-info span {
            color: var(--text-main);
            font-weight: 600;
        }

        .balance-section {
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }

        .balance-title {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: 700;
            color: #fde047;
            margin-bottom: 20px;
        }

        .wallet-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .wallet-buttons button {
            padding: 12px;
            background: #0f172a;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .wallet-buttons button:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            display: block;
            text-decoration: none;
            box-sizing: border-box;
            font-size: 15px;
            transition: opacity 0.2s;
        }

        .logout-btn:hover {
            opacity: 0.9;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0b1120;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 65px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
            flex: 1;
            cursor: pointer;
        }

        .nav-item.active {
            color: #ffd700;
        }

        .nav-item span.icon {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .nav-item-center {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            text-decoration: none;
            cursor: pointer;
        }

        .floating-center-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #fde047, #ca8a04);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: -25px;
            box-shadow: 0 4px 15px rgba(253, 224, 71, 0.4);
            color: #0f172a;
            font-size: 22px;
            border: 2px solid #0b1120;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">My Profile</div>
        
        <!-- Profile & Balance Card -->
        <div class="card">
            <div class="profile-header">
                <img src="assets/female.png" class="profile-pic" alt="Profile Picture" id="profilePic">
                <div class="profile-info">
                    <h1 id="profileUsername">User</h1>
                    <div class="vip">⭐ VIP 1</div>
                    <p>Phone: <span id="profilePhone">--</span></p>
                    <p>Invitation Code: <span id="profileInviteCode">----</span></p>
                </div>
            </div>

            <div class="balance-section">
                <div class="balance-title">Available Balance</div>
                <div class="balance-amount" id="profileBalance">$0.00</div>
                <div class="wallet-buttons">
                    <button onclick="alert('Add Wallet feature coming soon!')">➕ Add Wallet</button>
                    <button onclick="alert('Deposit feature coming soon!')">💳 Deposit</button>
                    <button onclick="alert('Withdrawal feature coming soon!')">⬇ Withdraw</button>
                    <button onclick="window.location.href='records.html'">📜 Transaction</button>
                </div>
            </div>
        </div>

        <!-- Logout Card -->
        <div class="card" style="padding: 16px;">
            <button class="logout-btn" id="logoutBtn">
                Log Out / Switch Account
            </button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <span class="icon">🏠</span><span>Home</span>
        </a>
        <a href="start.html" class="nav-item-center">
            <div class="floating-center-btn">⚡</div>
        </a>
        <a href="records.html" class="nav-item">
            <span class="icon">📋</span><span>Records</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <span class="icon">👤</span><span>My</span>
        </a>
    </nav>

    <script>
        const currentUsername = localStorage.getItem('username');

        if (!currentUsername) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('profileUsername').textContent = currentUsername;
            document.getElementById('profilePhone').textContent = localStorage.getItem('userPhone') || 'N/A';
            document.getElementById('profileInviteCode').textContent = localStorage.getItem('myInviteCode') || 'N/A';

            const balanceKey = `userBalance_${currentUsername}`;
            const userBal = parseFloat(localStorage.getItem(balanceKey) || '10.00').toFixed(2);
            document.getElementById('profileBalance').textContent = '$' + userBal;

            const gender = localStorage.getItem('userGender');
            if (gender === 'Male') {
                document.getElementById('profilePic').src = 'assets/male.png';
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('username');
            localStorage.removeItem('userName');
            localStorage.removeItem('userGender');
            localStorage.removeItem('userPhone');
            localStorage.removeItem('myInviteCode');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
