<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Submission - Luxury VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --primary-dark: #0f172a;
            --card-dark: #1e293b;
            --accent-gold: #d4af37;
            --accent-gold-light: #fef08a;
            --bg-color: #090d16;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 50px;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .page-title {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }
        .order-card {
            background: var(--card-dark);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        .product-img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 14px;
            border: 2px solid var(--accent-gold);
            margin-bottom: 15px;
        }
        .product-name {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 15px;
            font-family: 'Cinzel', serif;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin: 10px 0;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }
        .info-row strong {
            color: var(--accent-gold);
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #0f172a;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            font-family: 'Cinzel', serif;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            margin-top: 10px;
        }
        .btn-back {
            width: 100%;
            background: transparent;
            color: var(--text-muted);
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="page-title">⚡ Order Optimization & Submission</div>

        <div class="order-card">
            <img id="orderImg" class="product-img" src="" alt="Product">
            <div id="orderName" class="product-name">Loading Product...</div>
            
            <div class="info-row">
                <span>Order Amount:</span>
                <strong id="orderPriceDisplay">0.00 USD</strong>
            </div>
            <div class="info-row">
                <span>Estimated Commission:</span>
                <strong id="orderEarningsDisplay">0.00 USD</strong>
            </div>
            <div class="info-row">
                <span>Return Total:</span>
                <strong id="orderReturnDisplay">0.00 USD</strong>
            </div>
        </div>

        <button class="btn-submit" onclick="submitOrder()">SUBMIT OPTIMIZATION ORDER</button>
        <button class="btn-back" onclick="window.location.href='task.html'">Return to Task Hub</button>
    </div>

    <script>
        // Uniform Username & Key Resolution
        const currentUsername = localStorage.getItem('userName') || 
                                localStorage.getItem('username') || 
                                localStorage.getItem('loggedInUser') || 
                                localStorage.getItem('currentUser') || 
                                localStorage.getItem('accountName') || 'PPPP';

        const userKeySuffix = currentUsername.trim();
        const balanceKey = `userBalance_${userKeySuffix}`;
        const taskKey = `completedTasks_${userKeySuffix}`;

        // Retrieve active order details saved from task hub
        const orderName = localStorage.getItem('currentOrderName') || "Luxury Designer Handbag";
        const orderImg = localStorage.getItem('currentOrderImg') || "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=400&q=80";
        const orderPrice = parseFloat(localStorage.getItem('currentOrderPrice')) || 5.00;
        const orderEarnings = parseFloat(localStorage.getItem('currentOrderEarnings')) || 0.02;
        const returnTotal = orderPrice + orderEarnings;

        // Render details to UI elements
        document.getElementById('orderName').textContent = orderName;
        document.getElementById('orderImg').src = orderImg;
        document.getElementById('orderPriceDisplay').textContent = orderPrice.toFixed(2) + ' USD';
        document.getElementById('orderEarningsDisplay').textContent = orderEarnings.toFixed(2) + ' USD';
        document.getElementById('orderReturnDisplay').textContent = returnTotal.toFixed(2) + ' USD';

        function submitOrder() {
            // Retrieve latest balances
            let currentBalance = parseFloat(localStorage.getItem(balanceKey)) || parseFloat(localStorage.getItem('userBalance')) || 10.00;
            let todaysProfit = parseFloat(localStorage.getItem('todaysProfit')) || 0.00;
            let completedTasksCount = parseInt(localStorage.getItem(taskKey)) || parseInt(localStorage.getItem('completedTasksCount')) || 0;

            // Credit principal back + commission earnings
            currentBalance += returnTotal;
            todaysProfit += orderEarnings;
            completedTasksCount += 1;

            // Save back to storage keys securely
            localStorage.setItem(balanceKey, currentBalance.toFixed(2));
            localStorage.setItem('userBalance', currentBalance.toFixed(2));
            localStorage.setItem('todaysProfit', todaysProfit.toFixed(2));
            localStorage.setItem(taskKey, completedTasksCount);
            localStorage.setItem('completedTasksCount', completedTasksCount);

            alert("Order submitted successfully! Commission credited.");
            window.location.href = 'task.html';
        }
    </script>
</body>
</html>
