<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Luxury VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.3);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .register-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px 24px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--text-muted); }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Create Account</h2>
        <form onsubmit="handleRegister(event)">
            <div class="form-group"><label>Full Name</label><input type="text" id="regName" required></div>
            <div class="form-group"><label>Phone Number</label><input type="tel" id="regPhone" required></div>
            <div class="form-group"><label>Gender</label><select id="regGender" required><option value="Male">Male</option><option value="Female">Female</option></select></div>
            <div class="form-group"><label>Password</label><input type="password" id="regPassword" required></div>
            <button type="submit" class="btn-submit">Sign Up</button>
        </form>
    </div>
    <script>
        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            localStorage.setItem('userName', name);
            localStorage.setItem('userGender', document.getElementById('regGender').value);
            localStorage.setItem(`userBalance_${name}`, '10.00'); // INITIAL BALANCE
            alert('Registration successful!');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
