<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Luxury VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            /* Premium Rich Blue Theme matching your Sign Up page */
            --primary-color: #f8fafc;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --bg-color: #090d16;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.3);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        .auth-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .language-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .language-header select {
            width: auto;
            padding: 6px 10px;
            font-size: 12px;
            background: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
        }

        h2 {
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
            font-weight: 700;
            font-size: 24px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            color: var(--text-color);
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-muted);
        }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            margin-top: 5px;
        }

        button.submit-btn:hover {
            opacity: 0.9;
        }

        .error-msg {
            color: #f87171;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .switch-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .switch-link a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="language-header">
            <select id="languageSelect">
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="zh">中文</option>
                <option value="ja">日本語</option>
                <option value="hi">हिन्दी</option>
                <option value="ar">العربية</option>
                <option value="pt">Português</option>
                <option value="ru">Русский</option>
                <option value="it">Italiano</option>
                <option value="ko">한국어</option>
            </select>
        </div>

        <h2>Log In</h2>
        <form id="loginForm">
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <button type="button" id="togglePassword" class="toggle-password">👁️</button>
                </div>
                <div id="formError" class="error-msg"></div>
            </div>

            <button type="submit" class="submit-btn">Log In</button>

            <div class="switch-link">
                Don't have an account? <a href="index.html">Sign Up</a>
            </div>
        </form>
    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? '👁️' : '🔒';
            });
        }

        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();
            
            const formError = document.getElementById('formError');
            const usernameInput = document.getElementById('username').value.trim();
            const passVal = passwordInput.value;

            let users = JSON.parse(localStorage.getItem('usersList')) || [];

            const foundUser = users.find(u => u.username.toLowerCase() === usernameInput.toLowerCase());

            if (!foundUser || foundUser.password !== passVal) {
                formError.textContent = 'Invalid username or password. Please try again.';
                formError.style.display = 'block';
                return;
            }

            formError.style.display = 'none';

            // Set current active session details
            localStorage.setItem('userName', foundUser.username);
            localStorage.setItem('username', foundUser.username);
            localStorage.setItem('userGender', foundUser.gender);
            localStorage.setItem('userPhone', foundUser.phone);
            localStorage.setItem('myInviteCode', foundUser.myInviteCode);

            // Initialize isolated balance/tasks if they don't exist yet for this user
            const balanceKey = `userBalance_${foundUser.username}`;
            if (localStorage.getItem(balanceKey) === null) {
                localStorage.setItem(balanceKey, '10.00');
                localStorage.setItem(`completedTasks_${foundUser.username}`, '0');
                localStorage.setItem(`todaysProfit_${foundUser.username}`, '0.00');
                localStorage.setItem(`totalProfit_${foundUser.username}`, '0.00');
            }

            alert('Login successful!');
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
