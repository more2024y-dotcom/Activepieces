<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account - Luxury VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --primary-color: #f8fafc;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --bg-color: #090d16;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.3);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            padding-bottom: 90px;
        }

        .auth-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .language-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .language-header select {
            width: auto;
            padding: 6px 10px;
            font-size: 12px;
            background: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
        }

        h2 {
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
            font-weight: 700;
            font-size: 24px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            color: var(--text-color);
        }

        input:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .phone-group {
            display: flex;
            gap: 10px;
        }

        .phone-group select {
            width: 140px;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-muted);
        }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            margin-top: 5px;
        }

        button.submit-btn:hover {
            opacity: 0.9;
        }

        .error-msg {
            color: #f87171;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .switch-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .switch-link a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        /* Bottom Navigation Bar Styles (4 Items) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0b1120;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 65px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
            flex: 1;
            cursor: pointer;
        }

        .nav-item.active {
            color: #ffd700;
        }

        .nav-item span.icon {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .nav-item-center {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            text-decoration: none;
            cursor: pointer;
        }

        .floating-center-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #fde047, #ca8a04);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: -25px;
            box-shadow: 0 4px 15px rgba(253, 224, 71, 0.4);
            color: #0f172a;
            font-size: 22px;
            border: 2px solid #0b1120;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="language-header">
            <select id="languageSelect">
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="zh">中文</option>
                <option value="ja">日本語</option>
                <option value="hi">हिन्दी</option>
                <option value="ar">العربية</option>
                <option value="pt">Português</option>
                <option value="ru">Русский</option>
                <option value="it">Italiano</option>
                <option value="ko">한국어</option>
            </select>
        </div>

        <h2>Create Account</h2>
        <form id="signupForm">
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="" disabled selected>Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <div class="phone-group">
                    <select id="countryCode">
                        <option value="+1">🇺🇸 +1 (US)</option>
                        <option value="+44">🇬🇧 +44 (UK)</option>
                        <option value="+91">🇮🇳 +91 (IN)</option>
                        <option value="+86">🇨🇳 +86 (CN)</option>
                        <option value="+81">🇯🇵 +81 (JP)</option>
                        <option value="+49">🇩🇪 +49 (DE)</option>
                        <option value="+33">🇫🇷 +33 (FR)</option>
                        <option value="+55">🇧🇷 +55 (BR)</option>
                        <option value="+52">🇲🇽 +52 (MX)</option>
                        <option value="+61">🇦🇺 +61 (AU)</option>
                        <option value="+971">🇦🇪 +971 (UAE)</option>
                        <option value="+27">🇿🇦 +27 (ZA)</option>
                    </select>
                    <input type="tel" id="phone" placeholder="Enter phone number" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Login Password</label>
                <div class="password-container">
                    <input type="password" id="password" placeholder="At least 6 characters" required>
                    <button type="button" id="togglePassword" class="toggle-password">👁️</button>
                </div>
            </div>

            <div class="form-group">
                <label for="transPassword">Transaction Password</label>
                <div class="password-container">
                    <input type="password" id="transPassword" placeholder="At least 6 characters" required>
                    <button type="button" id="toggleTransPassword" class="toggle-password">👁️</button>
                </div>
            </div>

            <div class="form-group">
                <label for="inviteCode">Invite Code</label>
                <input type="text" id="inviteCode" placeholder="Enter invite code" required>
                <div id="formError" class="error-msg"></div>
            </div>

            <button type="submit" class="submit-btn">Sign Up</button>

            <div class="switch-link">
                Already have an account? <a href="login.html">Log In</a>
            </div>
        </form>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <span class="icon">🏠</span><span>Home</span>
        </a>
        <a href="start.html" class="nav-item-center">
            <div class="floating-center-btn">⚡</div>
        </a>
        <a href="records.html" class="nav-item">
            <span class="icon">📋</span><span>Records</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="icon">👤</span><span>My</span>
        </a>
    </nav>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? '👁️' : '🔒';
            });
        }

        const toggleTransPassword = document.getElementById('toggleTransPassword');
        const transPasswordInput = document.getElementById('transPassword');
        if (toggleTransPassword && transPasswordInput) {
            toggleTransPassword.addEventListener('click', function () {
                const type = transPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                transPasswordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? '👁️' : '🔒';
            });
        }

        function generateRandomInviteCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 4; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        const signupForm = document.getElementById('signupForm');
        signupForm.addEventListener('submit', function (e) {
            e.preventDefault();
            
            const formError = document.getElementById('formError');
            const usernameInput = document.getElementById('username').value.trim();
            const phoneInput = document.getElementById('phone').value.trim();
            const inviteCodeInput = document.getElementById('inviteCode').value.trim().toUpperCase();
            const passVal = passwordInput.value;
            const transPassVal = transPasswordInput.value;

            let users = JSON.parse(localStorage.getItem('usersList')) || [];

            const existingUser = users.find(u => u.username.toLowerCase() === usernameInput.toLowerCase());
            if (existingUser) {
                formError.textContent = 'This username is already taken. Please choose another one.';
                formError.style.display = 'block';
                return;
            }

            const phoneDigitsOnly = phoneInput.replace(/\D/g, '');
            if (phoneDigitsOnly.length < 7) {
                formError.textContent = 'Please enter a valid phone number correctly.';
                formError.style.display = 'block';
                return;
            }

            if (passVal.length < 6) {
                formError.textContent = 'Login password must be at least 6 characters long.';
                formError.style.display = 'block';
                return;
            }

            if (transPassVal.length < 6) {
                formError.textContent = 'Transaction password must be at least 6 characters long.';
                formError.style.display = 'block';
                return;
            }

            const masterInviteCode = '2DI2'; 
            const isMasterCode = (inviteCodeInput === masterInviteCode);
            const foundReferrer = users.find(u => u.myInviteCode === inviteCodeInput);

            if (!isMasterCode && !foundReferrer) {
                formError.textContent = 'Invalid invite code. Please enter a valid referral code.';
                formError.style.display = 'block';
                return;
            }
            
            formError.style.display = 'none';

            const fullPhone = document.getElementById('countryCode').value + ' ' + phoneInput;
            const selectedGender = document.getElementById('gender').value;
            const selectedLang = document.getElementById('languageSelect').value;

            let newUniqueCode = generateRandomInviteCode();
            while (users.some(u => u.myInviteCode === newUniqueCode) || newUniqueCode === masterInviteCode) {
                newUniqueCode = generateRandomInviteCode();
            }

            const newUser = {
                username: usernameInput,
                gender: selectedGender,
                phone: fullPhone,
                password: passVal,
                transPassword: transPassVal,
                language: selectedLang,
                myInviteCode: newUniqueCode
            };

            users.push(newUser);
            localStorage.setItem('usersList', JSON.stringify(users));

            alert('Account created successfully! Your personal invite code is: ' + newUniqueCode);
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
