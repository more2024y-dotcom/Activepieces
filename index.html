<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Luxury VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --primary-dark: #0f172a;
            --card-dark: #1e293b;
            --accent-gold: #d4af37;
            --bg-color: #090d16;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-card {
            background: var(--card-dark);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        .title {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 20px;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .input-field {
            width: 100%;
            background: #0f172a;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            color: var(--text-main);
            padding: 12px;
            font-size: 14px;
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
        }
        .input-field:focus {
            border-color: var(--accent-gold);
        }
        .btn-auth {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #0f172a;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="title">Luxury VIP Portal</div>
        <div class="subtitle">Login or Register with your username</div>
        <input type="text" id="usernameInput" class="input-field" placeholder="Enter username...">
        <button class="btn-auth" onclick="loginOrRegister()">ENTER DASHBOARD</button>
    </div>

    <script>
        function loginOrRegister() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                alert("Please enter a valid username.");
                return;
            }

            // Save active session username
            localStorage.setItem('userName', username);

            // Scoped keys for this specific user
            const balanceKey = `userBalance_${username}`;
            const taskKey = `completedTasks_${username}`;
            const profitKey = `todaysProfit_${username}`;

            // Provision a fresh slate if it's a brand new account
            if (localStorage.getItem(balanceKey) === null) {
                localStorage.setItem(balanceKey, "10.00");
            }
            if (localStorage.getItem(taskKey) === null) {
                localStorage.setItem(taskKey, "0");
            }
            if (localStorage.getItem(profitKey) === null) {
                localStorage.setItem(profitKey, "0.00");
            }

            // Redirect directly to the dashboard
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
