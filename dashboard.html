<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Luxury VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #090d16;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.3);
            --gold-color: #facc15;
            --gold-gradient: linear-gradient(135deg, #facc15, #ca8a04);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .account-display {
            font-weight: 700;
            color: var(--gold-color);
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .home-btn {
            background: #334155;
            color: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }

        .home-btn:hover {
            background: #475569;
        }

        .hub-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .hub-card h2 {
            margin-top: 0;
            color: var(--gold-color);
            font-size: 22px;
            margin-bottom: 10px;
        }

        .hub-card p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0;
            line-height: 1.5;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .stat-box.full-width {
            grid-column: span 2;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--gold-color);
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            background: var(--gold-gradient);
            color: #1e293b;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(250, 204, 21, 0.3);
            transition: opacity 0.2s, transform 0.1s;
            text-align: center;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* Modal Overlay for Task Simulation */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 13, 22, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .modal-card h3 {
            color: var(--gold-color);
            margin-top: 0;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .product-img {
            width: 100px;
            height: 100px;
            background: #0f172a;
            border-radius: 12px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 1px solid var(--border-color);
        }

        .product-name {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f8fafc;
        }

        .product-price {
            font-size: 15px;
            color: var(--gold-color);
            font-weight: 600;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Top Bar with Account & Back to Homepage Button -->
        <div class="top-bar">
            <div class="account-display" id="displayUser">ACCOUNT: NNNNNN</div>
            <a href="login.html" class="home-btn">🏠 Home</a>
        </div>

        <!-- VIP Task Hub Header Card -->
        <div class="hub-card">
            <h2>VIP TASK HUB</h2>
            <p>Complete your daily optimization tasks to earn 0.5% commission.</p>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Total Balance</div>
                <div class="stat-value" id="totalBalance">10.00 USD</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Completed Tasks</div>
                <div class="stat-value" id="completedTasks">0 / 40</div>
            </div>
            <div class="stat-box full-width">
                <div class="stat-label">Today's Profit</div>
                <div class="stat-value" id="todaysProfit">0.00 USD</div>
            </div>
        </div>

        <!-- Start Task Button -->
        <button class="action-btn" id="startTaskBtn">START OPTIMIZATION TASK</button>
    </div>

    <!-- Task Execution Modal -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal-card">
            <h3 id="modalTitle">Optimizing Product...</h3>
            <div class="product-img" id="productIcon">👜</div>
            <div class="product-name" id="productName">Loading Product...</div>
            <div class="product-price" id="productPrice">Price: $0.00 | Commission: $0.00</div>
            <button class="action-btn" id="submitTaskBtn">Submit Task</button>
        </div>
    </div>

    <script>
        // Retrieve current logged-in user
        const currentUser = localStorage.getItem('username') || localStorage.getItem('userName') || 'NNNNNN';
        document.getElementById('displayUser').textContent = `ACCOUNT: ${currentUser.toUpperCase()}`;

        // Isolated localStorage keys for the current user
        const balanceKey = `userBalance_${currentUser}`;
        const tasksKey = `completedTasks_${currentUser}`;
        const profitKey = `todaysProfit_${currentUser}`;

        // Initialize defaults if not present
        if (localStorage.getItem(balanceKey) === null) {
            localStorage.setItem(balanceKey, '10.00');
            localStorage.setItem(tasksKey, '0');
            localStorage.setItem(profitKey, '0.00');
        }

        // DOM elements
        const totalBalanceEl = document.getElementById('totalBalance');
        const completedTasksEl = document.getElementById('completedTasks');
        const todaysProfitEl = document.getElementById('todaysProfit');
        const startTaskBtn = document.getElementById('startTaskBtn');
        const taskModal = document.getElementById('taskModal');
        const submitTaskBtn = document.getElementById('submitTaskBtn');
        const productNameEl = document.getElementById('productName');
        const productPriceEl = document.getElementById('productPrice');
        const productIconEl = document.getElementById('productIcon');

        // Diverse pool of luxury products so tasks change dynamically
        const luxuryProducts = [
            { name: "Luxury Designer Handbag", icon: "👜", basePrice: 280.00 },
            { name: "Swiss Gold Chronograph Watch", icon: "⌚", basePrice: 450.00 },
            { name: "Diamond Encrusted Necklace", icon: "💎", basePrice: 620.00 },
            { name: "Italian Leather Oxford Shoes", icon: "👞", basePrice: 210.00 },
            { name: "Pure Silk Designer Scarf", icon: "🧣", basePrice: 150.00 },
            { name: "Exclusive 18K Gold Bracelet", icon: "✨", basePrice: 380.00 },
            { name: "Signature Luxury Sunglasses", icon: "🕶️", basePrice: 190.00 },
            { name: "Couture Velvet Evening Clutch", icon: "👛", basePrice: 310.00 }
        ];

        let currentTaskData = null;

        function updateUI() {
            let balance = parseFloat(localStorage.getItem(balanceKey)) || 10.00;
            let tasks = parseInt(localStorage.getItem(tasksKey)) || 0;
            let profit = parseFloat(localStorage.getItem(profitKey)) || 0.00;

            totalBalanceEl.textContent = balance.toFixed(2) + ' USD';
            completedTasksEl.textContent = tasks + ' / 40';
            todaysProfitEl.textContent = profit.toFixed(2) + ' USD';
        }

        updateUI();

        startTaskBtn.addEventListener('click', function() {
            let tasks = parseInt(localStorage.getItem(tasksKey)) || 0;
            if (tasks >= 40) {
                alert('You have completed all 40 tasks for today!');
                return;
            }

            // Pick a random product from the list so it changes every time
            const randomProduct = luxuryProducts[Math.floor(Math.random() * luxuryProducts.length)];
            let balance = parseFloat(localStorage.getItem(balanceKey)) || 10.00;
            
            // Generate realistic randomized item price based on balance scale
            let itemPrice = randomProduct.basePrice + (balance * 0.1);
            let commission = itemPrice * 0.005; // 0.5% commission

            currentTaskData = {
                name: randomProduct.name,
                icon: randomProduct.icon,
                price: itemPrice,
                commission: commission
            };

            productIconEl.textContent = currentTaskData.icon;
            productNameEl.textContent = currentTaskData.name;
            productPriceEl.textContent = `Price: $${itemPrice.toFixed(2)} | Commission: +$${commission.toFixed(2)}`;

            taskModal.style.display = 'flex';
        });

        submitTaskBtn.addEventListener('click', function() {
            if (!currentTaskData) return;

            let balance = parseFloat(localStorage.getItem(balanceKey)) || 10.00;
            let tasks = parseInt(localStorage.getItem(tasksKey)) || 0;
            let profit = parseFloat(localStorage.getItem(profitKey)) || 0.00;

            balance += currentTaskData.commission;
            profit += currentTaskData.commission;
            tasks += 1;

            localStorage.setItem(balanceKey, balance.toFixed(2));
            localStorage.setItem(tasksKey, tasks);
            localStorage.setItem(profitKey, profit.toFixed(2));

            taskModal.style.display = 'none';
            updateUI();
            alert(`Task completed successfully! Commission earned: +$${currentTaskData.commission.toFixed(2)}`);
        });
    </script>
</body>
</html>
