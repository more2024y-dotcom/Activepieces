<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Hub - Luxury VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --primary-dark: #0f172a;
            --card-dark: #1e293b;
            --accent-gold: #d4af37;
            --bg-color: #090d16;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 50px;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .user-display {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 15px;
            font-weight: 700;
        }
        .card {
            background: var(--card-dark);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
            font-family: 'Cinzel', serif;
        }
        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-gold);
        }
        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #0f172a;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            font-family: 'Cinzel', serif;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="user-display">Account: <span id="usernameDisplay">User</span></div>
            <button onclick="logout()" style="background:none; border:1px solid var(--text-muted); color:var(--text-muted); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px;">Logout</button>
        </div>

        <div class="card" style="text-align: center;">
            <h2 style="font-family: 'Cinzel', serif; color: var(--accent-gold); margin-top: 0;">VIP Task Hub</h2>
            <p style="color: var(--text-muted); font-size: 13px;">Complete your daily optimization tasks to earn 0.5% commission.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Total Balance</div>
                <div class="stat-value" id="balanceDisplay">10.00 USD</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Completed Tasks</div>
                <div class="stat-value" id="taskCountDisplay">0 / 40</div>
            </div>
            <div class="stat-box" style="grid-column: span 2;">
                <div class="stat-label">Today's Profit</div>
                <div class="stat-value" id="profitDisplay">0.00 USD</div>
            </div>
        </div>

        <button class="btn-main" onclick="startTask()">START OPTIMIZATION TASK</button>
    </div>

    <script>
        // 1. Enforce Account Isolation based on logged-in user
        const currentUsername = localStorage.getItem('userName') || 'DefaultUser';
        document.getElementById('usernameDisplay').textContent = currentUsername;

        const balanceKey = `userBalance_${currentUsername}`;
        const taskKey = `completedTasks_${currentUsername}`;
        const profitKey = `todaysProfit_${currentUsername}`;

        // 2. Initialize new accounts cleanly if they have no records yet
        if (localStorage.getItem(balanceKey) === null) {
            localStorage.setItem(balanceKey, "10.00");
        }
        if (localStorage.getItem(taskKey) === null) {
            localStorage.setItem(taskKey, "0");
        }
        if (localStorage.getItem(profitKey) === null) {
            localStorage.setItem(profitKey, "0.00");
        }

        // 3. Load values strictly from user-isolated keys
        let currentBalance = parseFloat(localStorage.getItem(balanceKey));
        let completedTasksCount = parseInt(localStorage.getItem(taskKey));
        let todaysProfit = parseFloat(localStorage.getItem(profitKey));

        // Render to UI
        document.getElementById('balanceDisplay').textContent = currentBalance.toFixed(2) + ' USD';
        document.getElementById('taskCountDisplay').textContent = completedTasksCount + ' / 40';
        document.getElementById('profitDisplay').textContent = todaysProfit.toFixed(2) + ' USD';

        function startTask() {
            if (completedTasksCount >= 40) {
                alert("You have reached your daily limit of 40 tasks.");
                return;
            }

            if (currentBalance < 5.00) {
                alert("Insufficient balance to start optimization.");
                return;
            }

            // Deduct task requirement from balance
            let taskCost = 5.00;
            let earnings = taskCost * 0.005; // 0.5% commission

            currentBalance -= taskCost;
            localStorage.setItem(balanceKey, currentBalance.toFixed(2));

            // Set temporary order metadata for submit.html
            localStorage.setItem('currentOrderName', "Luxury Designer Handbag");
            localStorage.setItem('currentOrderImg', "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=400&q=80");
            localStorage.setItem('currentOrderPrice', taskCost.toFixed(2));
            localStorage.setItem('currentOrderEarnings', earnings.toFixed(2));

            // Navigate to submission page
            window.location.href = 'submit.html';
        }

        function logout() {
            localStorage.removeItem('userName');
            window.location.href = 'index.html'; // Adjust to your login page filename if different
        }
    </script>
</body>
</html>
