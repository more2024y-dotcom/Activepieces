<script>
        const currentUsername = "PPPP";
        localStorage.setItem('userName', currentUsername);

        const balanceKey = `userBalance_${currentUsername}`;
        const taskKey = `completedTasks_${currentUsername}`;

        if (localStorage.getItem(balanceKey) === null) {
            localStorage.setItem(balanceKey, "10.00");
        }
        if (localStorage.getItem('userBalance') === null) {
            localStorage.setItem('userBalance', "10.00");
        }

        let currentBalance = parseFloat(localStorage.getItem(balanceKey)) || parseFloat(localStorage.getItem('userBalance')) || 10.00;
        let completedTasksCount = parseInt(localStorage.getItem(taskKey)) || parseInt(localStorage.getItem('completedTasksCount')) || 0;

        let isBalanceHidden = false;

        function renderUI() {
            if (isBalanceHidden) {
                document.getElementById('balanceDisplay').textContent = '********';
            } else {
                document.getElementById('balanceDisplay').textContent = currentBalance.toFixed(2) + ' USD';
            }
            document.getElementById('startBtn').textContent = `START OPTIMIZATION (${completedTasksCount} / 40)`;
        }

        function toggleBalanceVisibility() {
            isBalanceHidden = !isBalanceHidden;
            renderUI();
            document.getElementById('eyeToggleBtn').textContent = isBalanceHidden ? '🔒' : '👁️';
        }

        renderUI();

        const productPool = [
            { name: "CD button skirt pants", img: "https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?auto=format&fit=crop&w=400&q=80" },
            { name: "Luxury Designer Handbag", img: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=400&q=80" },
            { name: "Classic Gold Watch", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=400&q=80" },
            { name: "Wireless Smart Headphones", img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=400&q=80" },
            { name: "Smart Fitness Watch", img: "https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?auto=format&fit=crop&w=400&q=80" },
            { name: "Designer Sunglasses", img: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=400&q=80" }
        ];

        function startTaskOptimization() {
            currentBalance = parseFloat(localStorage.getItem(balanceKey)) || parseFloat(localStorage.getItem('userBalance')) || 10.00;
            completedTasksCount = parseInt(localStorage.getItem(taskKey)) || parseInt(localStorage.getItem('completedTasksCount')) || 0;

            if (completedTasksCount >= 40) {
                alert("You have already completed your 40/40 tasks for today.");
                return;
            }

            if (currentBalance <= 0) {
                alert("Your account balance is insufficient. Please top up funds.");
                return;
            }

            // Calculate a valid random order amount based on balance
            let randomOrderPrice;
            if (currentBalance <= 20) {
                randomOrderPrice = parseFloat((currentBalance * (0.5 + Math.random() * 0.3)).toFixed(2));
                if (randomOrderPrice < 1.00) randomOrderPrice = 1.00;
            } else {
                randomOrderPrice = parseFloat((currentBalance * 0.4).toFixed(2));
            }

            if (currentBalance < randomOrderPrice) {
                alert("Your account balance is insufficient to temporarily cover the product price of $" + randomOrderPrice.toFixed(2) + ".");
                return;
            }

            const commissionRate = 0.005;
            const earnings = parseFloat((randomOrderPrice * commissionRate).toFixed(2));

            // Deduct balance temporarily for the active order
            currentBalance -= randomOrderPrice;
            localStorage.setItem(balanceKey, currentBalance.toFixed(2));
            localStorage.setItem('userBalance', currentBalance.toFixed(2));

            // Pick a random product
            const selectedProduct = productPool[Math.floor(Math.random() * productPool.length)];

            // Save details for submit.html
            localStorage.setItem('currentOrderName', selectedProduct.name);
            localStorage.setItem('currentOrderImg', selectedProduct.img);
            localStorage.setItem('currentOrderPrice', randomOrderPrice.toFixed(2));
            localStorage.setItem('currentOrderEarnings', earnings.toFixed(2));

            // Instantly transition to submission page
            window.location.href = 'submit.html';
        }
    </script>
