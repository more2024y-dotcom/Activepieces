<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard & Task Hub - Luxury VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --primary-dark: #0f172a;
            --card-dark: #1e293b;
            --accent-gold: #d4af37;
            --accent-gold-light: #fef08a;
            --bg-color: #090d16;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 50px;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .header-welcome {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .dashboard-card {
            background: var(--card-dark);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 45px;
            height: 45px;
            border: 2px solid var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            color: var(--accent-gold);
            font-size: 18px;
        }
        .user-details span {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
        }
        .user-details strong {
            font-size: 16px;
            color: var(--text-main);
            font-family: 'Cinzel', serif;
        }
        .vip-badge {
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #0f172a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            font-family: 'Cinzel', serif;
        }
        .balance-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }
        .balance-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .balance-amount {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
            margin-top: 5px;
        }
        .profit-container {
            background: var(--card-dark);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .profit-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }
        .profit-value {
            font-size: 26px;
            font-weight: 800;
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
            margin-top: 8px;
        }
        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #0f172a;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            font-family: 'Cinzel', serif;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-welcome" id="welcomeHeader">HI PPPP , WELCOME BACK 👑</div>

        <div class="dashboard-card">
            <div class="user-row">
                <div class="user-info">
                    <div class="avatar">P</div>
                    <div class="user-details">
                        <strong>PPPP</strong>
                        <span>Credit Score: 100%</span>
                    </div>
                </div>
                <div class="vip-badge">VIP 1</div>
            </div>
            <div class="balance-section">
                <div class="balance-label">Total balance</div>
                <div class="balance-amount" id="totalBalanceDisplay">10.00 USD</div>
            </div>
        </div>

        <div class="profit-container">
            <div class="profit-title">Today's Profit</div>
            <div class="profit-value" id="todaysProfitDisplay">0.00 USD</div>
        </div>

        <button class="btn-action" onclick="window.location.href='submit.html'">Go to Task Submission Page</button>
    </div>

    <script>
        // Uniform Username & Key Resolution
        const currentUsername = localStorage.getItem('userName') || 
                                localStorage.getItem('username') || 
                                localStorage.getItem('loggedInUser') || 
                                localStorage.getItem('currentUser') || 
                                localStorage.getItem('accountName') || 'PPPP';

        const userKeySuffix = currentUsername.trim();
        const balanceKey = `userBalance_${userKeySuffix}`;

        // Load and synchronize unified balances safely across pages
        let currentBalance = parseFloat(localStorage.getItem(balanceKey)) || parseFloat(localStorage.getItem('userBalance'));
        if (isNaN(currentBalance)) {
            currentBalance = 10.00;
            localStorage.setItem(balanceKey, currentBalance.toFixed(2));
            localStorage.setItem('userBalance', currentBalance.toFixed(2));
        }

        let todaysProfit = parseFloat(localStorage.getItem('todaysProfit'));
        if (isNaN(todaysProfit)) todaysProfit = 0.00;

        // Render to UI elements
        document.getElementById('totalBalanceDisplay').textContent = currentBalance.toFixed(2) + ' USD';
        document.getElementById('todaysProfitDisplay').textContent = todaysProfit.toFixed(2) + ' USD';
        document.getElementById('welcomeHeader').textContent = `HI ${userKeySuffix.toUpperCase()} , WELCOME BACK 👑`;
    </script>
</body>
</html>
