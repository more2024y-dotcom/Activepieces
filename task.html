<script>
        const storedUser = localStorage.getItem('userName') || localStorage.getItem('username');
        if (storedUser) {
            document.getElementById('usernameDisplay').textContent = storedUser;
            document.getElementById('welcomeName').textContent = storedUser;
            document.getElementById('avatarLetter').textContent = storedUser.charAt(0).toUpperCase();
        }

        const storedInvite = localStorage.getItem('inviteCode');
        if (storedInvite) {
            document.getElementById('inviteCodeDisplay').textContent = storedInvite;
        }

        let currentBalance = parseFloat(localStorage.getItem('userBalance'));
        if (isNaN(currentBalance)) {
            currentBalance = 10.00;
            localStorage.setItem('userBalance', currentBalance);
        }
        document.getElementById('balanceDisplay').textContent = currentBalance.toFixed(2) + ' USD';

        let todaysProfit = parseFloat(localStorage.getItem('todaysProfit'));
        if (isNaN(todaysProfit)) {
            todaysProfit = 0.00;
            localStorage.setItem('todaysProfit', todaysProfit.toFixed(2));
        }

        let totalProfit = parseFloat(localStorage.getItem('totalProfit'));
        if (isNaN(totalProfit)) {
            totalProfit = 0.00;
            localStorage.setItem('totalProfit', totalProfit.toFixed(2));
        }

        // FIXED: New accounts start at 0/40 tasks instead of hardcoded 17
        let completedTasksCount = parseInt(localStorage.getItem('completedTasksCount'));
        if (isNaN(completedTasksCount)) {
            completedTasksCount = 0;
            localStorage.setItem('completedTasksCount', completedTasksCount);
        }
        
        const totalTasksMax = 40;
        document.getElementById('optStatusLabel').textContent = `Start Optimization (${completedTasksCount} / ${totalTasksMax})`;
        document.getElementById('startingBtn').textContent = `Starting (${completedTasksCount}/${totalTasksMax})`;

        const productCatalog = [
            { name: "CD button skirt pants", img: "https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?auto=format&fit=crop&w=400&q=80" },
            { name: "Classic Casual Leather Shoes", img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=400&q=80" },
            { name: "Wireless Noise-Canceling Headphones", img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=400&q=80" },
            { name: "Minimalist Smart Watch Series", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=400&q=80" },
            { name: "Professional DSLR Camera Body", img: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=400&q=80" },
            { name: "Designer Summer Sun Hat", img: "https://images.unsplash.com/photo-1534215754734-18e55d134347?auto=format&fit=crop&w=400&q=80" },
            { name: "Luxury Silk Evening Scarf", img: "https://images.unsplash.com/photo-1606760227091-3dd870d97f1d?auto=format&fit=crop&w=400&q=80" }
        ];

        function startTaskOptimization() {
            // Block if tasks reach 40/40
            if (completedTasksCount >= 40) {
                alert("You have already completed your 40/40 tasks for today.");
                return;
            }

            const randomProduct = productCatalog[Math.floor(Math.random() * productCatalog.length)];
            
            let randomOrderPrice;
            if (currentBalance <= 20) {
                randomOrderPrice = parseFloat((8 + Math.random() * 7).toFixed(2));
            } else if (currentBalance <= 200) {
                randomOrderPrice = parseFloat((50 + Math.random() * 150).toFixed(2));
            } else {
                randomOrderPrice = Math.floor(800 + Math.random() * 2000);
            }

            const commissionRate = 0.005;
            const earnings = randomOrderPrice * commissionRate;

            currentBalance -= randomOrderPrice;
            todaysProfit += earnings;
            totalProfit += earnings;
            completedTasksCount++;

            localStorage.setItem('todaysProfit', todaysProfit.toFixed(2));
            localStorage.setItem('totalProfit', totalProfit.toFixed(2));
            localStorage.setItem('userBalance', currentBalance);
            localStorage.setItem('completedTasksCount', completedTasksCount);

            localStorage.setItem('currentOrderName', randomProduct.name);
            localStorage.setItem('currentOrderImg', randomProduct.img);
            localStorage.setItem('currentOrderPrice', randomOrderPrice);
            localStorage.setItem('currentOrderEarnings', earnings);

            window.location.href = 'submit.html';
        }
    </script>
