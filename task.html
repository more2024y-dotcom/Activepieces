<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Luxury VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --primary-blue: #0284c7;
            --dark-blue: #0f172a;
            --accent-blue: #38bdf8;
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.3);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .register-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .register-container h2 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 22px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 800;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
            transition: opacity 0.2s;
            margin-top: 6px;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .login-link a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>Create Account</h2>
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="regName">Full Name</label>
                <input type="text" id="regName" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="regPhone">Phone Number</label>
                <input type="tel" id="regPhone" placeholder="Enter phone number" required>
            </div>
            <div class="form-group">
                <label for="regGender">Gender</label>
                <select id="regGender" required>
                    <option value="" disabled selected>Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            <div class="form-group">
                <label for="regPassword">Login Password</label>
                <input type="password" id="regPassword" placeholder="Create a login password" required>
            </div>
            <div class="form-group">
                <label for="regTxPassword">Transaction Password</label>
                <input type="password" id="regTxPassword" placeholder="Create your unique transaction password" required>
            </div>
            <div class="form-group">
                <label for="regInviteCode">Invitation Code (Optional)</label>
                <input type="text" id="regInviteCode" placeholder="Enter friend's invitation code">
            </div>
            <button type="submit" class="btn-submit">Sign Up</button>
        </form>
        <div class="login-link">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref');
            if (refCode) {
                document.getElementById('regInviteCode').value = refCode;
            }
        });

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const gender = document.getElementById('regGender').value;
            const password = document.getElementById('regPassword').value;
            const txPassword = document.getElementById('regTxPassword').value.trim();
            const inviteCodeUsed = document.getElementById('regInviteCode').value.trim();

            const myNewInviteCode = 'REF' + Math.floor(100000 + Math.random() * 900000);

            // Save user data securely to local storage
            localStorage.setItem('userName', name);
            localStorage.setItem('username', name);
            localStorage.setItem('userPhone', phone);
            localStorage.setItem('userGender', gender);
            localStorage.setItem('userPassword', password);
            localStorage.setItem('userTxPassword', txPassword);
            localStorage.setItem('myInviteCode', myNewInviteCode);

            // Set initial balance for the newly registered user
            localStorage.setItem(`userBalance_${name}`, '10.00');

            if (inviteCodeUsed) {
                localStorage.setItem('referredBy', inviteCodeUsed);
            }

            alert('Registration successful!');
            
            // Redirect straight to dashboard.html so it loads your new username immediately
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
