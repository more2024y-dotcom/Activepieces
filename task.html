<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Optimization - VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        :root {
            --primary-dark: #0f172a;
            --card-dark: #121b2f;
            --accent-gold: #d4af37;
            --accent-gold-light: #fef08a;
            --bg-color: #090d16;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 100px;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .top-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: var(--accent-gold);
            padding: 6px 14px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Cinzel', serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .header-title {
            font-size: 16px;
            font-weight: 700;
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
        }
        .task-card {
            background: linear-gradient(135deg, #0f172a, #162238);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
        }
        .progress-indicator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 18px;
            font-weight: 600;
        }
        .progress-indicator span b {
            color: var(--accent-gold);
        }
        .product-preview {
            background: rgba(10, 15, 28, 0.75);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            margin-bottom: 20px;
        }
        .product-image-container {
            width: 100%;
            height: 180px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-name {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }
        .product-rating {
            color: #f59e0b;
            font-size: 14px;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }
        .product-reviews-count {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .product-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .task-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 22px;
        }
        .stat-box {
            background: rgba(10, 15, 28, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .stat-box small {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .stat-box b {
            font-size: 15px;
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #0f172a;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #05080f;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 75px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.8);
            z-index: 1000;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            flex: 1;
        }
        .nav-item.active {
            color: var(--accent-gold);
        }
        .nav-item span.icon {
            font-size: 20px;
            margin-bottom: 3px;
        }
        .nav-center-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            border: 4px solid #05080f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
            font-size: 18px;
            margin-top: -25px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-nav-bar">
            <a href="dashboard.html" class="back-btn">← Back Home</a>
        </div>
        <div class="header-title">VIP TASK OF OPTIMIZATION</div>
        
        <div class="task-card">
            <div class="progress-indicator">
                <span>Task Progress: <b id="taskCountDisplay">0</b> / 10</span>
                <span>Commission Rate: <b>0.5%</b></span>
            </div>

            <div class="product-preview">
                <div class="product-image-container">
                    <img id="productImg" src="" alt="Product Image">
                </div>
                <div class="product-name" id="productName">LUXURY DESIGNER HANDBAG</div>
                <div class="product-rating" id="productRating">★★★★★</div>
                <div class="product-reviews-count" id="productReviews">(1,248 Reviews)</div>
                <div class="product-price" id="productPrice">Price: $866.00 USD</div>
            </div>

            <div class="task-stats">
                <div class="stat-box">
                    <small>Estimated Commission</small>
                    <b id="commissionDisplay">$4.33 USD</b>
                </div>
                <div class="stat-box">
                    <small>Return Total</small>
                    <b id="returnTotalDisplay">$870.33 USD</b>
                </div>
            </div>

            <button class="submit-btn" id="submitTaskBtn" onclick="completeTask()">SUBMIT OPTIMIZATION TASK</button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <span class="icon">🏠</span><span>Home</span>
        </a>
        <a href="withdraw.html" class="nav-item">
            <span class="icon">🛡️</span><span>Certificate</span>
        </a>
        <a href="task.html" class="nav-item active">
            <div class="nav-center-btn">⚡</div>
        </a>
        <a href="withdraw.html" class="nav-item">
            <span class="icon">📝</span><span>Records</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="icon">👤</span><span>My</span>
        </a>
    </div>

    <script>
        const currentUsername = localStorage.getItem('userName') ||
                                localStorage.getItem('username') ||
                                localStorage.getItem('loggedInUser') ||
                                localStorage.getItem('currentUser') ||
                                localStorage.getItem('accountName') || 'Guest';

        const userKeySuffix = currentUsername.trim();
        const taskKey = `completedTasks_${userKeySuffix}`;
        const balanceKey = `userBalance_${userKeySuffix}`;
        const todaysProfitKey = `todaysProfit_${userKeySuffix}`;

        const productCatalog = [
            { 
                name: "LUXURY DESIGNER LEATHER HANDBAG", 
                price: 866.00, 
                rating: "★★★★★", 
                reviews: "(1,420 Reviews)",
                image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=600&q=80" 
            },
            { 
                name: "SWISS AUTOMATIC GOLD CHRONOGRAPH WATCH", 
                price: 1250.00, 
                rating: "★★★★★", 
                reviews: "(890 Reviews)",
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80" 
            },
            { 
                name: "PREMIUM WIRELESS ACTIVE NOISE-CANCELING HEADPHONES", 
                price: 240.00, 
                rating: "★★★★★", 
                reviews: "(2,150 Reviews)",
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80" 
            },
            { 
                name: "4K ULTRA HD CURVED SMART OLED TV", 
                price: 650.00, 
                rating: "★★★★★", 
                reviews: "(630 Reviews)",
                image: "https://images.unsplash.com/photo-1593784991095-a205069470b6?auto=format&fit=crop&w=600&q=80" 
            },
            { 
                name: "DESIGNER SILK EVENING COUTURE GOWN", 
                price: 490.00, 
                rating: "★★★★★", 
                reviews: "(410 Reviews)",
                image: "https://images.unsplash.com/photo-1566174053879-31528523f8ae?auto=format&fit=crop&w=600&q=80" 
            },
            { 
                name: "PROFESSIONAL DSLR FULL-FRAME CAMERA KIT", 
                price: 1100.00, 
                rating: "★★★★★", 
                reviews: "(980 Reviews)",
                image: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=600&q=80" 
            },
            { 
                name: "ITALIAN FULL-GRAIN LEATHER BRIEFCASE", 
                price: 320.00, 
                rating: "★★★★★", 
                reviews: "(750 Reviews)",
                image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80" 
            },
            { 
                name: "18K WHITE GOLD DIAMOND ACCENT RING", 
                price: 1450.00, 
                rating: "★★★★★", 
                reviews: "(340 Reviews)",
                image: "https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=600&q=80" 
            },
            { 
                name: "LIMITED EDITION STREETWEAR DESIGNER SNEAKERS", 
                price: 380.00, 
                rating: "★★★★★", 
                reviews: "(1,890 Reviews)",
                image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80" 
            },
            { 
                name: "TITANIUM POLARIZED LUXURY SUNGLASSES", 
                price: 210.00, 
                rating: "★★★★★", 
                reviews: "(520 Reviews)",
                image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=600&q=80" 
            }
        ];

        function loadTaskData() {
            let completedCount = parseInt(localStorage.getItem(taskKey)) || 0;
            document.getElementById('taskCountDisplay').textContent = completedCount;

            let catalogIndex = completedCount % productCatalog.length;
            let currentItem = productCatalog[catalogIndex];

            document.getElementById('productImg').src = currentItem.image;
            document.getElementById('productName').textContent = currentItem.name;
            document.getElementById('productRating').textContent = currentItem.rating;
            document.getElementById('productReviews').textContent = currentItem.reviews;
            document.getElementById('productPrice').textContent = `Price: $${currentItem.price.toFixed(2)} USD`;

            let commission = currentItem.price * 0.005;
            let returnTotal = currentItem.price + commission;

            document.getElementById('commissionDisplay').textContent = `$${commission.toFixed(2)} USD`;
            document.getElementById('returnTotalDisplay').textContent = `$${returnTotal.toFixed(2)} USD`;
        }

        function completeTask() {
            let completedCount = parseInt(localStorage.getItem(taskKey)) || 0;
            if (completedCount >= 10) {
                alert("You have completed all your tasks for today!");
                return;
            }

            let catalogIndex = completedCount % productCatalog.length;
            let currentItem = productCatalog[catalogIndex];
            let commission = currentItem.price * 0.005;

            let currentBalance = parseFloat(localStorage.getItem(balanceKey)) || 10.00;
            let currentProfit = parseFloat(localStorage.getItem(todaysProfitKey)) || 0;

            currentBalance += commission;
            currentProfit += commission;
            completedCount += 1;

            localStorage.setItem(balanceKey, currentBalance.toFixed(2));
            localStorage.setItem(todaysProfitKey, currentProfit.toFixed(2));
            localStorage.setItem(taskKey, completedCount);

            alert(`Task successfully optimized! Earned $${commission.toFixed(2)} commission.`);
            loadTaskData();
        }

        loadTaskData();
    </script>
</body>
</html>
