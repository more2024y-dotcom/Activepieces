<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Order - Luxury VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --primary-dark: #0f172a;
            --card-dark: #1e293b;
            --accent-gold: #d4af37;
            --accent-gold-light: #fef08a;
            --bg-color: #090d16;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            padding-bottom: 100px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-gold);
            text-align: center;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-dark);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            text-align: center;
        }
        .product-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            margin-bottom: 15px;
        }
        .product-name {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
        }
        .order-details {
            text-align: left;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .detail-row span:first-child {
            color: var(--text-muted);
        }
        .detail-row span:last-child {
            font-weight: 700;
            color: var(--accent-gold);
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #0f172a;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            transition: opacity 0.2s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">Optimize & Submit Order</div>

        <div class="card">
            <img id="orderImg" src="" alt="Product Image" class="product-img">
            <div class="product-name" id="orderName">Loading Product...</div>

            <div class="order-details">
                <div class="detail-row">
                    <span>Order Price:</span>
                    <span id="orderPrice">0.00 USD</span>
                </div>
                <div class="detail-row">
                    <span>Commission (0.5%):</span>
                    <span id="orderEarnings">0.00 USD</span>
                </div>
            </div>

            <button class="submit-btn" onclick="submitOrder()">Submit Order & Complete Task</button>
        </div>
    </div>

    <script>
        // Load stored order details passed from task.html
        const name = localStorage.getItem('currentOrderName') || 'Luxury Item';
        const img = localStorage.getItem('currentOrderImg') || 'https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?auto=format&fit=crop&w=400&q=80';
        const price = parseFloat(localStorage.getItem('currentOrderPrice')) || 10.00;
        const earnings = parseFloat(localStorage.getItem('currentOrderEarnings')) || 0.05;

        document.getElementById('orderName').textContent = name;
        document.getElementById('orderImg').src = img;
        document.getElementById('orderPrice').textContent = price.toFixed(2) + ' USD';
        document.getElementById('orderEarnings').textContent = earnings.toFixed(2) + ' USD';

        function submitOrder() {
            // Retrieve current user balance and profit metrics
            let currentBalance = parseFloat(localStorage.getItem('userBalance')) || 10.00;
            let todaysProfit = parseFloat(localStorage.getItem('todaysProfit')) || 0.00;
            let totalProfit = parseFloat(localStorage.getItem('totalProfit')) || 0.00;

            // When order is submitted, the principal order price returns plus the commission earned
            currentBalance += price + earnings;
            todaysProfit += earnings;
            totalProfit += earnings;

            // Save updated balance back to localStorage
            localStorage.setItem('userBalance', currentBalance.toFixed(2));
            localStorage.setItem('todaysProfit', todaysProfit.toFixed(2));
            localStorage.setItem('totalProfit', totalProfit.toFixed(2));

            alert("Order submitted successfully! Commission added to your balance.");
            
            // Redirect back to task page
            window.location.href = 'task.html';
        }
    </script>

</body>
</html>
