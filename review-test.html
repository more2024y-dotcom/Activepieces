<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Review Test - Luxury VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(56, 189, 248, 0.3);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            max-width: 380px;
            width: 100%;
            margin: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .product-card img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .product-card h2 {
            margin: 10px 0 6px 0;
            font-size: 20px;
            color: #38bdf8;
        }

        .product-card p {
            margin: 0 0 15px 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .gold-btn {
            margin-top: 10px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #fde047, #ca8a04);
            color: #0f172a;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .gold-btn:hover {
            opacity: 0.9;
        }

        .stars {
            color: #fde047;
            font-size: 30px;
            margin: 15px 0 10px 0;
        }

        .review {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="product-card">
        <img src="assets/products/iphone.png" alt="iPhone 14 Plus">
        <h2>iPhone 14 Plus</h2>
        <p>Order Price: $600.00</p>
        
        <button class="gold-btn" onclick="automaticReview()">
            🟡 AUTOMATIC REVIEW
        </button>

        <div id="review-area"></div>
    </div>

    <script>
        let stars = 4;

        function automaticReview() {
            if (stars > 0) {
                stars--;
            }

            let starText = "";
            for (let i = 0; i < stars; i++) {
                starText += "★";
            }
            for (let i = stars; i < 5; i++) {
                starText += "☆";
            }

            document.getElementById("review-area").innerHTML = `
                <div class="stars">
                    ${starText}
                </div>
                <div class="review">
                    "Excellent product quality, fast delivery and good experience."
                </div>
            `;
        }
    </script>

</body>
</html>
